- name: search
  description: Searches through documentation with the given search query, returning a list of results
    with ID, title, and URL.
- name: fetch
  description: Gets detailed content for documentation by ID returned from the `search` tool.
- name: lithic-sandbox-setup
  description: Call once at the start of any Lithic sandbox task, before making API requests. Loads base
    URL, auth, unit conventions, and how to avoid oversized schema lookups.
- name: lithic-simulate-transaction
  description: Use whenever simulating card transactions in sandbox (authorize, clearing, void, return,
    advice). Simulate endpoints do not return the approval outcome, so this encodes the required verify
    step.
- name: lithic-auth-rule-lifecycle
  description: Use when creating, editing, or testing Authorization Rules in sandbox. A newly created
    rule does nothing until it is promoted; this encodes the draft/promote lifecycle and how to confirm
    a rule takes effect.
- name: lithic-query-data
  description: Use when listing or searching sandbox data (transactions, cards, accounts, rule results).
    Keeps responses small and filtered.
